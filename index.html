<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grab Bag Name Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EEEA; --ink:#142B22; --muted:#4D6359; --pine:#1F4D3A; --berry:#A8233A;
  --tag:#D8B98B; --tag-ink:#3A2814; --field:#FFFFFF; --line:#BFCFC7;
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F2219; --ink:#EAF1EC; --muted:#A6BBB0; --pine:#7FC4A0; --berry:#F07A8C;
    --tag:#C9A673; --tag-ink:#2E1F0E; --field:#183326; --line:#2E4D3E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F2219; --ink:#EAF1EC; --muted:#A6BBB0; --pine:#7FC4A0; --berry:#F07A8C;
  --tag:#C9A673; --tag-ink:#2E1F0E; --field:#183326; --line:#2E4D3E; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;
  background-image:radial-gradient(circle at 12% 8%, color-mix(in srgb,var(--pine) 10%,transparent) 0 2px, transparent 3px),
  radial-gradient(circle at 70% 30%, color-mix(in srgb,var(--pine) 8%,transparent) 0 2px, transparent 3px);
  background-size:90px 90px, 130px 130px;}
main{max-width:560px;margin:0 auto;padding:28px 20px 48px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.1rem,8vw,2.9rem);line-height:1.05;margin:8px 0 10px;color:var(--pine)}
.lede{color:var(--muted);margin:0 0 28px;max-width:40ch}
h2{font-family:var(--serif);font-weight:400;font-size:1.3rem;margin:0 0 12px}
.add{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
button{font:inherit;font-weight:700;cursor:pointer;border:none;border-radius:10px;padding:12px 18px}
.primary{background:var(--berry);color:#fff}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.chips{list-style:none;padding:0;margin:16px 0 8px;display:flex;flex-wrap:wrap;gap:8px}
.chips li{display:flex;align-items:center;gap:4px;background:var(--field);border:1.5px solid var(--line);border-radius:999px;padding:4px 4px 4px 14px;font-weight:500}
.chips button{background:none;color:var(--muted);padding:4px 10px;font-size:1.1rem;line-height:1}
.hint{color:var(--muted);font-size:.92rem;margin:4px 0 20px;min-height:1.4em}
.err{color:var(--berry)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:4px 0 26px}
.tag{position:relative;text-align:left;background:var(--tag);color:var(--tag-ink);border-radius:6px 22px 22px 6px;
  padding:18px 16px 16px 34px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;
  clip-path:polygon(0 18%,14px 0,100% 0,100% 100%,14px 100%,0 82%);font-weight:400}
.tag::before{content:"";position:absolute;left:14px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tag-ink) 35%,transparent)}
.tag .who{font-family:var(--serif);font-size:1.2rem;line-height:1.2;word-break:break-word}
.tag .state{font-size:.85rem;opacity:.75}
.tag.seen{opacity:.55}
.tag.seen .state::before{content:"✓ "}
dialog{border:none;border-radius:18px;padding:0;max-width:min(92vw,420px);width:100%;background:var(--field);color:var(--ink)}
dialog::backdrop{background:rgba(8,20,14,.7)}
.sheet{padding:28px 24px 22px;text-align:center}
.sheet p{margin:0;color:var(--muted)}
.big{font-family:var(--serif);font-size:clamp(2rem,10vw,2.8rem);color:var(--berry);margin:10px 0 22px;line-height:1.1;word-break:break-word}
.cover{display:block;width:100%;margin:12px 0 18px;padding:28px 12px;background:var(--pine);color:var(--bg);border-radius:12px;font-size:1.05rem}
.sheet .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pairs{list-style:none;padding:0;margin:0 0 20px}
.pairs li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.pairs li span:last-child{font-weight:700}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){
  .big{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
}
select{flex:1;min-width:0;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
select:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.card{background:var(--field);border:1.5px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center;margin-bottom:14px}
.card p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Grab bag name draw</h1>
  <p class="lede" id="lede">Pick your name to see who you’re buying a gift for. Keep it secret!</p>

  <section id="pick">
    <h2>Who are you?</h2>
    <form class="add" id="pickForm">
      <select id="who" aria-label="Your name"><option value="">Choose your name</option></select>
      <button class="primary" type="submit">Show my match</button>
    </form>
    <p class="hint" id="hint"></p>
  </section>

  <section id="result" class="hidden">
    <div class="card">
      <p id="hello"></p>
      <button class="cover" id="coverBtn">Make sure no one’s peeking, then tap to reveal</button>
      <div id="answer" class="hidden">
        <p>You’re buying a gift for</p>
        <div class="big" id="match"></div>
        <p id="budget"></p>
      </div>
    </div>
    <p class="hint">This device remembers your match, so you can come back to check it.</p>
    <!--<button class="ghost" id="resetBtn">Reset</button>-->
  </section>

  <section id="organizer" class="hidden">
    <h2>All pairs (organizer view)</h2>
    <ul class="pairs" id="pairsList"></ul>
  </section>
</main>

<script>
/* ================== EDIT THIS PART ================== */
const NAMES = [
  "Jane",
  "Steve",
  "Mike",
  "Ellen",
  "Amanda",
  "Sarah",
  "Jim S",
  "Jim B",
  "Jason",
  "Marzia",
  "Rosa",
  "Stacey"
];
// Change this word to redraw everyone with new pairs.
const DRAW_CODE = "christmas-2026";
// Spending limit shown with each match. Leave as "" to hide it.
const BUDGET = "$10-$15 gift - Can do simple gift cards [gas, grocery, starbucks, dunkin', etc.] ";
/* ==================================================== */

const $ = id => document.getElementById(id);
const KEY = "grabbag-me-" + DRAW_CODE;

// Seeded random numbers: everyone who opens the page gets the same draw.
function seedFrom(str){ let h = 1779033703 ^ str.length;
  for (let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; }
  return () => { h = Math.imul(h ^ h>>>16, 2246822507); h = Math.imul(h ^ h>>>13, 3266489909); return (h ^= h>>>16) >>> 0; };
}
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a);
  t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }

// Shuffle everyone into one circle; each person gives to the next.
// Nobody gets themselves and nobody is picked twice.
function buildDraw(){
  const rand = mulberry(seedFrom(DRAW_CODE + "|" + NAMES.join("|"))());
  const idx = NAMES.map((_,i)=>i);
  for (let i=idx.length-1;i>0;i--){ const j = Math.floor(rand()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  const m = {}; idx.forEach((g,k)=>{ m[NAMES[g]] = NAMES[idx[(k+1)%idx.length]]; });
  return m;
}
const draw = buildDraw();

function remember(name){ try { localStorage.setItem(KEY, name); } catch(e){} }
function recall(){ try { return localStorage.getItem(KEY); } catch(e){ return null; } }
function forget(){ try { localStorage.removeItem(KEY); } catch(e){} }

function showPick(){
  $("pick").classList.remove("hidden"); $("result").classList.add("hidden");
}
function showResult(name, revealed){
  $("pick").classList.add("hidden"); $("result").classList.remove("hidden");
  $("hello").textContent = "Hi " + name + "!";
  $("match").textContent = revealed ? draw[name] : "";
  $("budget").textContent = BUDGET ? "Spending limit: " + BUDGET : "";
  $("coverBtn").classList.toggle("hidden", revealed);
  $("answer").classList.toggle("hidden", !revealed);
}

const sel = $("who");
[...NAMES].sort((a,b)=>a.localeCompare(b)).forEach(n=>{ const o=document.createElement("option"); o.value=n; o.textContent=n; sel.appendChild(o); });

$("pickForm").addEventListener("submit", e=>{
  e.preventDefault();
  if (!sel.value){ $("hint").textContent = "Choose your name from the list first."; $("hint").classList.add("err"); return; }
  remember(sel.value); showResult(sel.value, false);
});
$("coverBtn").onclick = ()=>{ const n = recall(); if (n) showResult(n, true); };
$("resetBtn").onclick = ()=>{ forget(); sel.value=""; $("hint").textContent=""; showPick(); };

function route(){
  const org = location.hash === "#organizer";
  $("organizer").classList.toggle("hidden", !org);
  if (org){
    $("pick").classList.add("hidden"); $("result").classList.add("hidden");
    $("lede").textContent = "Only you should see this page.";
    $("pairsList").innerHTML = NAMES.map(n=>`<li><span>${n}</span><span>${draw[n]}</span></li>`).join("");
    return;
  }
  $("lede").textContent = "Pick your name to see who you’re buying a gift for. Keep it secret!";
  if (NAMES.length < 3){ $("hint").textContent = "The organizer needs to add at least three names."; $("hint").classList.add("err"); }
  const me = recall();
  me && draw[me] ? showResult(me, true) : showPick();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
